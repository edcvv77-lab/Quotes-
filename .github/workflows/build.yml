name: Build Camouflage Quotes App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Patch BlackBox Dependencies on Server
      run: |
        echo "تحديث روابط المكتبات داخل ملفات BlackBox على السيرفر..."
        find . -name "build.gradle" -exec sed -i 's|me.weishu:free_reflection.*|com.github.tiann:FreeReflection:3.1.0|g' {} +

    - name: Grant Execute Permission
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aiham-Quotes-PrivateSpace
        path: app/build/outputs/apk/debug/*.apk
