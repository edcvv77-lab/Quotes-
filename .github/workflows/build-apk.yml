name: Build Aiham Private Space

on:
  workflow_dispatch:
  push:
    branches: [main, phase2-runtime-fix]
  pull_request:
    branches: [main]

concurrency:
  group: quotes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned BlackBox revision
        run: |
          test "$(git -C BlackBox rev-parse HEAD)" = "823ffcbe8b94055ba68767c7422b4d174550fa86"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;30.0.3" "ndk;21.0.6113669"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run real app unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Verify unit test report exists
        run: |
          test -n "$(find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -print -quit)"

      - name: Build guest, host, and device-test APKs
        run: ./gradlew :AihamVirtualTest:assembleDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify embedded guest matches current guest build
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s AihamVirtualTest/build/outputs/apk/debug/AihamVirtualTest-debug.apk
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/AihamVirtualTest-debug.apk > /tmp/embedded-guest.apk
          cmp /tmp/embedded-guest.apk AihamVirtualTest/build/outputs/apk/debug/AihamVirtualTest-debug.apk

      - name: Prepare deterministic artifact names
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Aiham-Quotes-debug.apk
          cp AihamVirtualTest/build/outputs/apk/debug/AihamVirtualTest-debug.apk dist/AihamVirtualTest-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/Aiham-Quotes-runtime-tests.apk
          test -s dist/Aiham-Quotes-debug.apk
          test -s dist/AihamVirtualTest-debug.apk
          test -s dist/Aiham-Quotes-runtime-tests.apk
          sha256sum dist/*.apk

      - name: Verify final APK metadata and merged BlackBox manifest
        run: |
          AAPT="$ANDROID_HOME/build-tools/30.0.3/aapt"
          "$AAPT" dump badging dist/Aiham-Quotes-debug.apk | tee /tmp/host-badging.txt
          "$AAPT" dump badging dist/AihamVirtualTest-debug.apk | tee /tmp/guest-badging.txt
          grep -F "package: name='com.aiham.quotes'" /tmp/host-badging.txt
          grep -F "sdkVersion:'21'" /tmp/host-badging.txt
          grep -F "targetSdkVersion:'30'" /tmp/host-badging.txt
          grep -F "package: name='com.aiham.virtualtest'" /tmp/guest-badging.txt
          grep -F "targetSdkVersion:'30'" /tmp/guest-badging.txt
          "$AAPT" dump xmltree dist/Aiham-Quotes-debug.apk AndroidManifest.xml > /tmp/host-manifest.txt
          grep -F "top.niunaijun.blackbox.app.LauncherActivity" /tmp/host-manifest.txt
          grep -F "top.niunaijun.blackbox.proxy.ProxyActivity" /tmp/host-manifest.txt

      - name: Upload host APK
        uses: actions/upload-artifact@v4
        with:
          name: Aiham-Quotes-debug
          path: dist/Aiham-Quotes-debug.apk
          if-no-files-found: error

      - name: Upload guest test APK
        uses: actions/upload-artifact@v4
        with:
          name: AihamVirtualTest-debug
          path: dist/AihamVirtualTest-debug.apk
          if-no-files-found: error

      - name: Upload Android runtime tests
        uses: actions/upload-artifact@v4
        with:
          name: Aiham-Quotes-runtime-tests
          path: dist/Aiham-Quotes-runtime-tests.apk
          if-no-files-found: error


  runtime-api30:
    name: Android 11 ARM runtime
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download host APK
        uses: actions/download-artifact@v4
        with:
          name: Aiham-Quotes-debug
          path: runtime/host

      - name: Download runtime test APK
        uses: actions/download-artifact@v4
        with:
          name: Aiham-Quotes-runtime-tests
          path: runtime/tests

      - name: Verify ARM runner and APK inputs
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
          test -s runtime/host/Aiham-Quotes-debug.apk
          test -s runtime/tests/Aiham-Quotes-runtime-tests.apk

      - name: Run BlackBox acceptance test on Android 11 ARM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: arm64-v8a
          channel: canary
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-accel -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "30"
            echo "Host packages before install:"
            adb shell pm list packages | grep -E 'com\.aiham\.(quotes|virtualtest)' || true
            if adb shell pm list packages | grep -q 'package:com.aiham.virtualtest'; then
              echo "Guest unexpectedly installed as host package before test"
              exit 1
            fi
            adb install -r runtime/host/Aiham-Quotes-debug.apk
            adb install -r runtime/tests/Aiham-Quotes-runtime-tests.apk
            adb logcat -c
            adb shell am instrument -w -r com.aiham.quotes.test/androidx.test.runner.AndroidJUnitRunner | tee runtime/instrumentation.txt
            grep -q '^OK (1 test)' runtime/instrumentation.txt
            if adb shell pm list packages | grep -q 'package:com.aiham.virtualtest'; then
              echo "Guest leaked into host PackageManager after BlackBox test"
              exit 1
            fi
            adb logcat -d -v time > runtime/logcat.txt
            grep -E 'AIHAM_ENGINE|AIHAM_GUEST|AIHAM_SPACE' runtime/logcat.txt | tail -200 || true

      - name: Upload Android 11 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-11-ARM-runtime-evidence
          path: |
            runtime/instrumentation.txt
            runtime/logcat.txt
          if-no-files-found: warn
