name: Build Aiham Private Space

on:
  workflow_dispatch:
  push:
    branches: [main, phase2-runtime-fix]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;30.0.3" "ndk;21.0.6113669"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run project unit tests
        run: ./gradlew :app:testDebugUnitTest :AihamVirtualTest:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Verify generated APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s AihamVirtualTest/build/outputs/apk/debug/AihamVirtualTest-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk AihamVirtualTest/build/outputs/apk/debug/AihamVirtualTest-debug.apk

      - name: Upload host APK
        uses: actions/upload-artifact@v4
        with:
          name: Aiham-Quotes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload virtual test APK
        uses: actions/upload-artifact@v4
        with:
          name: AihamVirtualTest-debug
          path: AihamVirtualTest/build/outputs/apk/debug/AihamVirtualTest-debug.apk
          if-no-files-found: error
