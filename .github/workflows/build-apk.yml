name: Build Aiham Private Space

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;28.0.2" "ndk;21.0.6113669"

      - name: Make Gradle executable
        run: chmod +x ./gradlew


      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload host APK
        uses: actions/upload-artifact@v4
        with:
          name: Aiham-Quotes-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload virtual test APK
        uses: actions/upload-artifact@v4
        with:
          name: AihamVirtualTest-debug
          path: AihamVirtualTest/build/outputs/apk/debug/*.apk
