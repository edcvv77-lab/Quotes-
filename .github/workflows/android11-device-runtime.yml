name: Android 11 Physical Runtime Acceptance

on:
  workflow_dispatch:

jobs:
  runtime-api30-device:
    name: Android 11 ARM physical runtime
    runs-on: [self-hosted, android, arm64, api30]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify connected Android 11 ARM device
        run: |
          set -euo pipefail
          adb wait-for-device
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "30"
          case "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" in
            arm64-v8a|armeabi-v7a) ;;
            *) echo "Unsupported device ABI"; exit 1 ;;
          esac

      - name: Download latest host artifact from this workflow context
        run: |
          echo "Install the host and runtime-test APKs on this self-hosted runner before dispatching."
          test -n "${AIHAM_HOST_APK:-}" || { echo "AIHAM_HOST_APK is required"; exit 1; }
          test -n "${AIHAM_TEST_APK:-}" || { echo "AIHAM_TEST_APK is required"; exit 1; }
          test -s "$AIHAM_HOST_APK"
          test -s "$AIHAM_TEST_APK"

      - name: Run BlackBox device acceptance
        run: |
          set -euo pipefail
          adb shell pm uninstall com.aiham.virtualtest >/dev/null 2>&1 || true
          if adb shell pm list packages | grep -q '^package:com.aiham.virtualtest$'; then
            echo "Guest exists as a normal host package before test"
            exit 1
          fi

          adb install -r "$AIHAM_HOST_APK"
          adb install -r "$AIHAM_TEST_APK"
          adb logcat -c

          adb shell am instrument -w -r com.aiham.quotes.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
          grep -q '^OK (1 test)' instrumentation.txt

          if adb shell pm list packages | grep -q '^package:com.aiham.virtualtest$'; then
            echo "Guest leaked into Android host PackageManager"
            exit 1
          fi

          adb logcat -d -v time > logcat.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-11-physical-runtime-evidence
          path: |
            instrumentation.txt
            logcat.txt
          if-no-files-found: warn
