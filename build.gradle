// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'me.weishu' && details.requested.name == 'free_reflection') {
                    details.useTarget("com.github.tiann:FreeReflection:3.1.0")
                }
            }
        }
    }
}

ext {
    compileSdkVersion = 33
    buildToolsVersion = "30.0.3"
    minSdkVersion = 21
    targetSdkVersion = 30
    versionCode = 1
    versionName = "1.0"
    xVersion = "1.1.0"
    blackReflection = "1.1.2"
}


def blackBoxOverlayDir = file("blackbox-overrides/Bcore")

tasks.register("applyBlackBoxOverlay") {
    inputs.dir(blackBoxOverlayDir)
    outputs.upToDateWhen { false }

    doLast {
        if (!blackBoxOverlayDir.isDirectory()) {
            throw new GradleException("BlackBox overlay directory is missing")
        }
        copy {
            from blackBoxOverlayDir
            into file("BlackBox/Bcore")
        }
    }
}

gradle.projectsEvaluated {
    if (findProject(":Bcore") != null) {
        project(":Bcore").tasks.configureEach { task ->
            if (task.name.startsWith("compile") && task.name.endsWith("JavaWithJavac")) {
                task.dependsOn(rootProject.tasks.named("applyBlackBoxOverlay"))
            }
        }
    }
}
