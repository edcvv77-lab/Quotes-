plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.aiham.quotes'
    compileSdk 33

    defaultConfig {
        applicationId "com.aiham.quotes"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(':Bcore')
}

task copyTestApk(type: Copy) {
    from project(':AihamVirtualTest').buildDir.absolutePath + '/outputs/apk/debug/AihamVirtualTest-debug.apk'
    into 'src/main/assets'
}
copyTestApk.dependsOn(':AihamVirtualTest:assembleDebug')
preBuild.dependsOn(copyTestApk)
